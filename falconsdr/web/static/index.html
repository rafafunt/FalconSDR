<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>FalconSDR</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#000000':'#f2f2f7';}}catch(e){}})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
