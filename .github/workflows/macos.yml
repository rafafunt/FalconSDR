# Experimental macOS build: GitHub's macOS runners build FalconSDR.app from a
# release tag, run its self-test and attach the zipped app to that release.
# Unsigned (no Apple Developer account) and untested on a real Mac with an
# SDR - hence "experimental". Run it from the Actions tab: "Run workflow".
name: macOS build (experimental)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the app to
        required: true
        default: v1.4.1
      ref:
        description: Branch, tag or commit to build (empty = the tag; set a branch while the release is still a draft)
        required: false
        default: ""
      attach:
        description: Attach the zips to the release (untick to only test a build - it never touches a published release)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (macos-14 is retired on 2026-11-02)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # libhackrf + libairspy (BSD-3-Clause; libusb LGPL-2.1) from Homebrew, bundled like on Linux/Windows
      # (AGENTS.md gotcha 55). The self-test below requires them: a build without them fails.
      - name: HackRF and Airspy libraries
        run: |
          brew install hackrf airspy
          for lib in libhackrf libairspy; do ls -la "$(brew --prefix)/lib/$lib.dylib"; done
      - name: Build FalconSDR.app
        # Same bundling rules as packaging/linux-deb/build.sh (AGENTS.md gotcha 35/43).
        run: |
          python -m venv venv
          venv/bin/pip install -q -r requirements.txt pyinstaller pillow
          echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' falconsdr/__init__.py)" >> "$GITHUB_ENV"
          venv/bin/pyinstaller --name FalconSDR --windowed --onedir --noconfirm \
            --icon packaging/icons/falconsdr.png --osx-bundle-identifier app.falconsdr \
            --add-data falconsdr/locale/pl.po:falconsdr/locale \
            --add-data falconsdr/presets/band_presets.json:falconsdr/presets \
            --add-data falconsdr/web/static:falconsdr/web/static \
            --collect-data tzdata --collect-data pyrtlsdrlib \
            --collect-data imageio_ffmpeg --collect-all pip \
            --add-binary "$(brew --prefix)/lib/libhackrf.dylib:." \
            --add-binary "$(brew --prefix)/lib/libairspy.dylib:." \
            main.py
      - name: Self-test of the built app
        env:
          FALCONSDR_REQUIRE_NATIVE_LIBS: "1"
        run: |
          set +e
          dist/FalconSDR.app/Contents/MacOS/FalconSDR --self-test
          rc=$?
          cat ~/.config/FalconSDR/falconsdr.log 2>/dev/null
          exit $rc
      # BSD-3-Clause (libhackrf, libairspy) wants its notice with a binary; the same file the Windows/Linux packages carry.
      - name: Third-party licences
        run: |
          out=dist/FalconSDR.app/Contents/Resources/THIRD-PARTY-LICENSES.txt
          venv/bin/python packaging/collect_licenses.py "$out"
          { for f in libhackrf libairspy; do
              printf '\n==============================================================================\n%s (bundled shared library)\n==============================================================================\n\n' "$f"
              cat "packaging/licenses/$f-BSD-3-Clause.txt"
            done
            for l in "$(brew --prefix libusb)"/COPYING*; do
              [ -f "$l" ] && { printf '\n==============================================================================\nlibusb (bundled shared library - Homebrew licence file %s)\n==============================================================================\n\n' "$(basename "$l")"; cat "$l"; }
            done; } >> "$out"
          grep -c "bundled shared library" "$out"
      # PyInstaller seals the bundle (ad-hoc) when it builds it; the licence file above was added afterwards, which
      # breaks the seal ("file added") and Gatekeeper then calls a downloaded app "damaged" (issue #11). Seal it
      # again (the nested code is already signed), then fail the build if the signature is not valid.
      - name: Re-seal and verify the signature
        run: |
          codesign --force --sign - dist/FalconSDR.app
          codesign --verify --deep --strict --verbose=2 dist/FalconSDR.app
      - name: Zip the app
        run: ditto -c -k --keepParent dist/FalconSDR.app "FalconSDR-$VERSION-macos-${{ matrix.arch }}-experimental.zip"
      # Kept as a workflow artifact too: a draft release has no tag yet, and a failed attach must not lose the build.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: FalconSDR-*-macos-*-experimental.zip
      - name: Attach to the release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "FalconSDR-$VERSION-macos-${{ matrix.arch }}-experimental.zip" --clobber
