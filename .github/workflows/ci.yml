name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py falconsdr tests
      - run: python -m unittest tests/test_core.py -v
      - if: runner.os == 'Linux'
        run: for f in falconsdr/web/static/js/*.js falconsdr/web/static/js/views/*.js; do node --check "$f"; done
      # New packaging must stay valid without building full bundles in CI:
      # shell syntax + RPM spec parses. (.SRCINFO sync is verified by the
      # AUR maintainer on release, not on every push - it needs the Arch
      # mirrors.)
      - if: runner.os == 'Linux'
        run: |
          bash -n packaging/install.sh
          bash -n packaging/rpm/build.sh
          bash -n packaging/appimage/build.sh
          bash -n packaging/rpm/build-in-docker.sh
          bash -n packaging/appimage/build-in-docker.sh
      - if: runner.os == 'Linux'
        run: python -c "import re; t=open('packaging/rpm/falconsdr.spec').read(); assert 'AutoReqProv' in t, 'spec must disable AutoReqProv (bundled /opt libs)'"
      - if: runner.os == 'Linux'
        run: |
          bash -n packaging/linux-native-libs.sh
          bash -n packaging/linux-deb/build.sh
      # The Windows build bundles libhackrf/libairspy from pinned conda-forge files (gotcha 55): fetch them the way
      # build.ps1 does and load them with nothing else on the machine - a changed hash or a missing DLL fails here, not
      # at release time.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install zstandard
          python packaging\windows\fetch_native_libs.py native
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:FALCONSDR_LIBHACKRF = (Resolve-Path native\hackrf-0.dll).Path
          $env:FALCONSDR_LIBAIRSPY = (Resolve-Path native\airspy.dll).Path
          python -c "from falconsdr import sdr_native as n; assert n.hackrf_library() is not None, 'libhackrf did not load'; assert n.airspy_library() is not None, 'libairspy did not load'; print('devices:', n.enumerate_here()['devices'])"
          if ($LASTEXITCODE -ne 0) { exit 1 }
