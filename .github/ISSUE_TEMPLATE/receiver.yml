name: Reception or receiver problem
description: Noise, buzzing, gaps, wrong pitch, no signal, a receiver that will not open or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you hear or see, on which frequency and modulation, and since when (e.g. after an update).
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System of the computer the receiver is plugged into
      options:
        - Windows
        - macOS
        - Linux
        - Raspberry Pi
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How FalconSDR was installed
      options:
        - Windows installer
        - Windows portable ZIP
        - macOS app
        - Linux .deb
        - Linux AppImage
        - Linux .rpm
        - From source (git clone / pip)
        - Don't know
  - type: input
    id: system_version
    attributes:
      label: System version (optional)
      description: The report below already has it when attached. Otherwise, if you can.
      placeholder: e.g. Windows 11 24H2, macOS 15.1 on M2, Ubuntu 24.04, Raspberry Pi OS 64-bit on a Pi 4
  - type: input
    id: receiver
    attributes:
      label: Receiver and antenna
      placeholder: e.g. RTL-SDR Blog V4, quarter-wave ground plane
  - type: textarea
    id: report
    attributes:
      label: Receiver report
      description: Settings -> Receiver health -> "Report a problem" fills this in. Without it - "Test the receiver", then "Copy report".
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A short recording (drag a .wav/.mp3 into this box, zipped if GitHub refuses it), a screenshot.
