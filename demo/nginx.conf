# /etc/nginx/sites-available/falconsdr.com - the online demo (static files from
# demo/dist). The 443 part and the redirect come from `certbot --nginx -d falconsdr.com`;
# www was added later with `certbot certonly --nginx --cert-name falconsdr.com -d falconsdr.com -d www.falconsdr.com`.
server {
    server_name falconsdr.com www.falconsdr.com;
    root /var/www/falconsdr.com;
    index index.html;

    # Always revalidate: a new deploy (sw.js, the app, the sounds) must reach returning visitors.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
    # Report-Only until the demo has been clicked through once with the console open
    # (no violations = rename to Content-Security-Policy). The app uses no eval/innerHTML
    # and loads nothing from other origins; style-src needs 'unsafe-inline' for style attributes.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    charset utf-8;

    # No visitor logs at all - nothing about the people who try the demo is kept.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One address: www and anything else land on https://falconsdr.com.
    if ($host != falconsdr.com) {
        return 301 https://falconsdr.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/falconsdr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/falconsdr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = falconsdr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.falconsdr.com) {
        return 301 https://falconsdr.com$request_uri;
    }

    server_name falconsdr.com www.falconsdr.com;
    access_log off;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}