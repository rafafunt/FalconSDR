# /etc/nginx/sites-available/falconsdr.com - the online demo (static files from
# demo/dist). The 443 part and the redirect come from `certbot --nginx -d falconsdr.com`.
server {
    server_name falconsdr.com;
    root /var/www/falconsdr.com;
    index index.html;

    # Always revalidate: a new deploy (sw.js, the app, the sounds) must reach returning visitors.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/falconsdr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/falconsdr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = falconsdr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name falconsdr.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}