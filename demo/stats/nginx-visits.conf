# /etc/nginx/conf.d/falconsdr-visits.conf - visitor counting for falconsdr.com
# (used by its site config: access_log ... falconsdr_visits if=$falconsdr_page).
js_import falconsdr_visits from /etc/nginx/njs/falconsdr-visits.js;
js_set $falconsdr_visitor falconsdr_visits.visitor;

# Only opening the page counts, not each file or API call it makes.
map "$request_method $request_uri" $falconsdr_page {
    "~^GET /(\?.*)?$" 1;
    default 0;
}

log_format falconsdr_visits '$time_iso8601 $falconsdr_visitor';
